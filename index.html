<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyflare Detections Board</title>

  <!-- Tab Logo -->
  <link rel="icon" href="cyflare_logo_only_shield.png" type="image/png">

  <!-- Cyflare Body Font -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
  >

  <style>
    :root {
      --dropdown-width: 270px;

      /* =======================================================
         CYFLARE BRAND COLORS
         ======================================================= */

      --mountain-green: #435f57;
      --white-cap: #fafafa;
      --vivid-blue: #066cf4;
      --marigold: #de9e36;
      --slate-purple: #8282d2;
      --crimson: #220c10;

      /* =======================================================
         TOOL COLORS
         ======================================================= */

      --stellar-color: #f58220;
      --crowdstrike-color: #d12127;
      --sentinelone-color: #6f3ff5;
      --cyflare-itdr-color: #066cf4;
      --cyflare-itdr-dark: #435f57;

      /* =======================================================
         LIGHT MODE
         ======================================================= */

      --bg-color: var(--white-cap);
      --text-color: var(--crimson);

      --card-bg: #ffffff;
      --table-border: #d7dedb;

      --header-bg: var(--mountain-green);
      --header-text: var(--white-cap);

      --primary-btn-bg: var(--vivid-blue);
      --primary-btn-text: var(--white-cap);

      --hover-bg: var(--mountain-green);

      --reset-btn-bg: var(--crimson);
      --export-btn-bg: var(--mountain-green);

      --row-even-bg: #f3f6f5;
      --row-hover-bg: #e5ece9;

      --input-bg: #ffffff;
      --input-border: #c5cfcc;

      --link-color: var(--vivid-blue);

      --badge-new-bg: var(--marigold);
      --badge-new-text: var(--crimson);
    }

    /* =========================================================
       DARK MODE
       ========================================================= */

    .dark-mode {
      --bg-color: var(--crimson);
      --text-color: #f1f4f3;

      --card-bg: #30171c;
      --table-border: #604950;

      --header-bg: var(--mountain-green);
      --header-text: var(--white-cap);

      --primary-btn-bg: var(--vivid-blue);
      --primary-btn-text: var(--white-cap);

      --hover-bg: var(--slate-purple);

      --reset-btn-bg: var(--marigold);
      --export-btn-bg: var(--mountain-green);

      --row-even-bg: #3a2026;
      --row-hover-bg: #4a2a31;

      --input-bg: #3a2026;
      --input-border: #765d63;

      --link-color: var(--marigold);

      --badge-new-bg: var(--marigold);
      --badge-new-text: var(--crimson);
    }

    /* =========================================================
       GLOBAL
       ========================================================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      background-color: var(--bg-color);
      color: var(--text-color);

      font-family: 'Inter', sans-serif;
      font-weight: 400;

      text-align: center;

      transition:
        background-color 0.3s,
        color 0.3s;
    }

    /* =========================================================
       TOP BAR
       ========================================================= */

    .top-bar {
      position: relative;
      height: 80px;
    }

    .logo-section {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }

    .logo-section img {
      max-width: 250px;
      height: auto;
      display: block;
      background-color: transparent;
    }

    .center-section {
      position: absolute;
      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);
      text-align: center;
    }

    .center-section h1 {
      margin: 0;

      color: var(--mountain-green);

      font-size: 2rem;
      font-weight: 600;
    }

    .dark-mode .center-section h1 {
      color: #f4f7f6;
    }

    .center-section .site-link {
      display: block;

      margin-top: 4px;

      color: var(--link-color);

      text-decoration: none;

      font-weight: 600;
    }

    .mode-toggle {
      position: absolute;

      right: 20px;
      top: 50%;

      transform: translateY(-50%);

      padding: 8px 16px;

      background: var(--primary-btn-bg);
      color: var(--primary-btn-text);

      border: none;
      border-radius: 8px;

      cursor: pointer;

      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    /* =========================================================
       SUMMARY STRIP
       ========================================================= */

    .summary-strip {
      max-width: 95%;

      margin: 0 auto 14px auto;

      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 12px;
    }

    .summary-card {
      position: relative;

      overflow: hidden;

      padding: 14px 18px;

      background: var(--card-bg);

      border: 1px solid var(--table-border);
      border-radius: 10px;

      box-shadow:
        0 2px 6px
        rgba(0,0,0,0.08);

      text-align: left;
    }

    .summary-card::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 5px;
    }

    .summary-card.total::before {
      background: var(--mountain-green);
    }

    .summary-card.active::before {
      background: var(--vivid-blue);
    }

    .summary-card.testing::before {
      background: var(--marigold);
    }

    .summary-card.tools::before {
      background: var(--slate-purple);
    }

    .summary-value {
      display: block;

      margin-bottom: 6px;

      color: var(--mountain-green);

      font-size: 1.8rem;
      font-weight: 700;

      line-height: 1;
    }

    .summary-label {
      display: block;

      color: var(--text-color);

      font-size: 0.72rem;
      font-weight: 600;

      text-transform: uppercase;

      letter-spacing: 0.6px;
    }

    .dark-mode .summary-value {
      color: var(--white-cap);
    }

    .dark-mode .summary-label {
      color: #d9e0de;
    }

    /* =========================================================
       FILTER BAR
       ========================================================= */

    .filter-bar {
      max-width: 95%;

      margin: 0 auto 20px auto;

      padding: 20px;

      display: flex;
      flex-wrap: wrap;

      justify-content: space-between;
      align-items: center;

      background: var(--card-bg);

      border-radius: 8px;

      box-shadow:
        0 2px 6px
        rgba(0,0,0,0.1);
    }

    .filters-left {
      display: flex;
      flex-wrap: wrap;

      gap: 10px;

      align-items: center;
    }

    .search-box {
      width: 300px;

      padding: 8px;

      background: var(--input-bg);
      color: var(--text-color);

      border: 1px solid var(--input-border);
      border-radius: 6px;

      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .search-box::placeholder {
      color: #6f7774;
      opacity: 1;
    }

    .dark-mode .search-box::placeholder {
      color: #b8c3c0;
    }

    .filter-btn,
    .action-btn {
      padding: 8px 16px;

      background: var(--mountain-green);
      color: var(--white-cap);

      border: none;
      border-radius: 8px;

      cursor: pointer;

      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;

      transition:
        background-color 0.2s,
        transform 0.2s;
    }

    .filter-btn:hover,
    .action-btn:hover {
      transform: translateY(-2px);
    }

    .filter-btn.filter-active,
    .action-btn.filter-active {
      background: var(--marigold);
      color: var(--crimson);

      font-weight: 600;
    }

    .reset-btn {
      background: var(--reset-btn-bg);
    }

    .export-btn {
      background: var(--export-btn-bg);
    }

    /* =========================================================
       DROPDOWNS
       ========================================================= */

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;

      position: absolute;

      width: var(--dropdown-width);

      margin-top: 8px;
      padding: 12px;

      background-color: var(--card-bg);

      border: 1px solid var(--table-border);
      border-radius: 8px;

      box-shadow:
        0 8px 16px
        rgba(0,0,0,0.2);

      text-align: left;

      z-index: 999;
    }

    .dropdown-content.show {
      display: block;
    }

    .dropdown-content label {
      display: flex;

      align-items: center;

      gap: 8px;

      padding: 6px 5px;

      cursor: pointer;

      border-radius: 6px;
    }

    .dropdown-content label:hover {
      background-color: var(--row-hover-bg);
    }

    .dark-mode .dropdown-content {
      color: #f4f7f6;
    }

    /* =========================================================
       FILTER OPTION LAYOUT
       ========================================================= */

    .filter-option-pill {
      display: inline-flex;

      align-items: center;

      padding: 4px 9px;

      border-radius: 999px;

      font-size: 0.82rem;
      font-weight: 600;

      white-space: nowrap;
    }

    .filter-option-row {
      display: flex;

      align-items: center;

      justify-content: space-between;

      flex: 1;

      min-width: 0;
    }

    .filter-count {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 30px;

      margin-left: 8px;

      padding: 3px 7px;

      border-radius: 999px;

      background: #edf1f0;
      color: var(--mountain-green);

      font-size: 0.74rem;
      font-weight: 700;

      line-height: 1;
    }

    .dark-mode .filter-count {
      background: #52363c;
      color: #f4f7f6;
    }

    /* =========================================================
       STATUS COLORS
       ========================================================= */

    .status-option.active input {
      accent-color: var(--mountain-green);
    }

    .status-option.active .filter-option-pill {
      background: var(--mountain-green);
      color: #ffffff;
    }

    .status-option.alert-preferences input {
      accent-color: var(--vivid-blue);
    }

    .status-option.alert-preferences .filter-option-pill {
      background: var(--vivid-blue);
      color: #ffffff;
    }

    .status-option.new-detection input,
    .status-option.testing input {
      accent-color: var(--marigold);
    }

    .status-option.new-detection .filter-option-pill,
    .status-option.testing .filter-option-pill {
      background: var(--marigold);
      color: var(--crimson);
    }

    .status-option.muted input {
      accent-color: var(--slate-purple);
    }

    .status-option.muted .filter-option-pill {
      background: var(--slate-purple);
      color: #ffffff;
    }

    .status-option.not-active input {
      accent-color: var(--crimson);
    }

    .status-option.not-active .filter-option-pill {
      background: var(--crimson);
      color: #ffffff;
    }

    /* =========================================================
       TOOL COLORS
       ========================================================= */

    .tool-option.stellar input {
      accent-color: var(--stellar-color);
    }

    .tool-option.stellar .filter-option-pill {
      background: var(--stellar-color);
      color: #ffffff;
    }

    .tool-option.crowdstrike input {
      accent-color: var(--crowdstrike-color);
    }

    .tool-option.crowdstrike .filter-option-pill {
      background: var(--crowdstrike-color);
      color: #ffffff;
    }

    .tool-option.sentinelone input {
      accent-color: var(--sentinelone-color);
    }

    .tool-option.sentinelone .filter-option-pill {
      background: var(--sentinelone-color);
      color: #ffffff;
    }

    .tool-option.cyflare-itdr input {
      accent-color: var(--cyflare-itdr-color);
    }

    .tool-option.cyflare-itdr .filter-option-pill {
      background:
        linear-gradient(
          135deg,
          var(--cyflare-itdr-dark),
          var(--cyflare-itdr-color)
        );

      color: #ffffff;
    }

    /* =========================================================
       SELECT COLUMNS COLORS
       ========================================================= */

    .column-option.primary input {
      accent-color: var(--mountain-green);
    }

    .column-option.primary .filter-option-pill {
      background: var(--mountain-green);
      color: #ffffff;
    }

    .column-option.status input {
      accent-color: var(--vivid-blue);
    }

    .column-option.status .filter-option-pill {
      background: var(--vivid-blue);
      color: #ffffff;
    }

    .column-option.tool input {
      accent-color: var(--slate-purple);
    }

    .column-option.tool .filter-option-pill {
      background: var(--slate-purple);
      color: #ffffff;
    }

    .column-option.connector input {
      accent-color: #4c87c8;
    }

    .column-option.connector .filter-option-pill {
      background: #4c87c8;
      color: #ffffff;
    }

    .column-option.mitre input {
      accent-color: var(--marigold);
    }

    .column-option.mitre .filter-option-pill {
      background: #f1d7a9;
      color: var(--crimson);

      border: 1px solid var(--marigold);
    }

    /* =========================================================
       TABLE
       ========================================================= */

    .table-container {
      max-width: 98%;
      max-height: 85vh;

      margin: 0 auto 20px auto;

      overflow: auto;

      background: var(--card-bg);

      border-radius: 12px;

      box-shadow:
        0 4px 10px
        rgba(0,0,0,0.1);
    }

    table {
      width: 100%;

      border-collapse: collapse;
    }

    th,
    td {
      padding: 12px;

      border-bottom:
        1px solid
        var(--table-border);
    }

    thead th {
      position: sticky;

      top: 0;

      z-index: 2;

      background: var(--header-bg);
      color: var(--header-text);

      border: none !important;

      cursor: pointer;

      font-weight: 600;
    }

    tbody tr:nth-child(even) {
      background: var(--row-even-bg);
    }

    tbody tr:hover {
      background: var(--row-hover-bg);
    }

    /* =========================================================
       DARK TABLE
       ========================================================= */

    .dark-mode #detectionsTable tbody tr:nth-child(odd) {
      background-color: #30171c;
    }

    .dark-mode #detectionsTable tbody tr:nth-child(even) {
      background-color: #3a2026;
    }

    .dark-mode #detectionsTable tbody tr:hover {
      background-color: #4a2a31;
    }

    .dark-mode #detectionsTable tbody td {
      color: #e6ecea;
    }

    .dark-mode #detectionsTable tbody td:first-child {
      color: #f4f7f6;
      font-weight: 500;
    }

    /* =========================================================
       TABLE ALIGNMENT
       ========================================================= */

    #detectionsTable th:nth-child(1),
    #detectionsTable td:nth-child(1),
    #detectionsTable th:nth-child(2),
    #detectionsTable td:nth-child(2) {
      text-align: left;
    }

    #detectionsTable th:not(:nth-child(1)):not(:nth-child(2)),
    #detectionsTable td:not(:nth-child(1)):not(:nth-child(2)) {
      text-align: center;
    }

    /* =========================================================
       STATUS + TOOL BADGES
       ========================================================= */

    .status-badge {
      display: inline-block;

      padding: 4px 8px;

      border-radius: 12px;

      font-weight: 700;
    }

    .table-tool-badge {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-width: 110px;

      padding: 5px 10px;

      border-radius: 999px;

      color: #ffffff !important;

      font-size: 0.78rem;
      font-weight: 600;

      white-space: nowrap;
    }

    .table-tool-badge.stellar {
      background: var(--stellar-color);
    }

    .table-tool-badge.crowdstrike {
      background: var(--crowdstrike-color);
    }

    .table-tool-badge.sentinelone {
      background: var(--sentinelone-color);
    }

    .table-tool-badge.cyflare-itdr {
      background:
        linear-gradient(
          135deg,
          var(--cyflare-itdr-dark),
          var(--cyflare-itdr-color)
        );
    }

    .table-tool-badge.other {
      background: var(--mountain-green);
    }

    /* =========================================================
       NEW BADGE
       ========================================================= */

    .new-badge {
      background-color: var(--badge-new-bg);
      color: #ffffff;

      padding: 2px 6px;

      border-radius: 4px;

      font-size: 0.75em;

      margin-right: 4px;

      font-weight: 700;
    }

    @media (max-width: 900px) {
      .summary-strip {
        grid-template-columns: repeat(2, 1fr);
      }
    }

  </style>
</head>

<body>

  <!-- =========================================================
       TOP
       ========================================================= -->

  <div class="top-bar">

    <div class="logo-section">
      <img
        src="cyflare logo.png"
        alt="Cyflare Logo"
      >
    </div>

    <div class="center-section">

      <h1>
        Cyflare Detections Board
      </h1>

      <a
        href="https://cyflare.com/"
        target="_blank"
        class="site-link"
      >
        Visit Cyflare.com
      </a>

    </div>

    <button
      class="mode-toggle"
      onclick="toggleMode()"
    >
      🌙
    </button>

  </div>

  <!-- =========================================================
       SUMMARY
       ========================================================= -->

  <div class="summary-strip">

    <div class="summary-card total">

      <span
        class="summary-value"
        id="summaryTotal"
      >
        0
      </span>

      <span class="summary-label">
        Total Detections
      </span>

    </div>

    <div class="summary-card active">

      <span
        class="summary-value"
        id="summaryActive"
      >
        0
      </span>

      <span class="summary-label">
        Active
      </span>

    </div>

    <div class="summary-card testing">

      <span
        class="summary-value"
        id="summaryTesting"
      >
        0
      </span>

      <span class="summary-label">
        Testing / New
      </span>

    </div>

    <div class="summary-card tools">

      <span
        class="summary-value"
        id="summaryTools"
      >
        0
      </span>

      <span class="summary-label">
        Tools
      </span>

    </div>

  </div>

  <!-- =========================================================
       FILTERS
       ========================================================= -->

  <div class="filter-bar">

    <div class="filters-left">

      <input
        type="text"
        id="search"
        class="search-box"
        onkeyup="filterTable()"
        placeholder="Search Detections..."
      >

      <!-- STATUS -->

      <div class="dropdown">

        <button
          class="filter-btn"
          id="statusFilterBtn"
          onclick="toggleDropdown('statusDropdown')"
        >
          Default Status
        </button>

        <div
          id="statusDropdown"
          class="dropdown-content"
        >

          <label
            class="status-option active"
            data-status="Active"
          >

            <input
              type="checkbox"
              value="Active"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Active
              </span>

              <span
                class="filter-count"
                data-count-status="Active"
              >
                0
              </span>

            </div>

          </label>

          <label
            class="status-option alert-preferences"
            data-status="Alert Preferences"
          >

            <input
              type="checkbox"
              value="Alert Preferences"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Alert Preferences
              </span>

              <span
                class="filter-count"
                data-count-status="Alert Preferences"
              >
                0
              </span>

            </div>

          </label>

          <label
            class="status-option new-detection"
            data-status="New Detection"
          >

            <input
              type="checkbox"
              value="New Detection"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                New Detection
              </span>

              <span
                class="filter-count"
                data-count-status="New Detection"
              >
                0
              </span>

            </div>

          </label>

          <label
            class="status-option testing"
            data-status="Testing"
          >

            <input
              type="checkbox"
              value="Testing"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Testing
              </span>

              <span
                class="filter-count"
                data-count-status="Testing"
              >
                0
              </span>

            </div>

          </label>

          <label
            class="status-option muted"
            data-status="Muted"
          >

            <input
              type="checkbox"
              value="Muted"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Muted
              </span>

              <span
                class="filter-count"
                data-count-status="Muted"
              >
                0
              </span>

            </div>

          </label>

          <label
            class="status-option not-active"
            data-status="Not Active"
          >

            <input
              type="checkbox"
              value="Not Active"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Not Active
              </span>

              <span
                class="filter-count"
                data-count-status="Not Active"
              >
                0
              </span>

            </div>

          </label>

        </div>

      </div>

      <!-- TOOL -->

      <div class="dropdown">

        <button
          class="filter-btn"
          id="toolFilterBtn"
          onclick="toggleDropdown('toolDropdown')"
        >
          Tool
        </button>

        <div
          id="toolDropdown"
          class="dropdown-content"
        >

          <label class="tool-option stellar">

            <input
              type="checkbox"
              value="Stellar Cyber"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Stellar Cyber
              </span>

              <span
                class="filter-count"
                data-count-tool="Stellar Cyber"
              >
                0
              </span>

            </div>

          </label>

          <label class="tool-option crowdstrike">

            <input
              type="checkbox"
              value="CrowdStrike"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                CrowdStrike
              </span>

              <span
                class="filter-count"
                data-count-tool="CrowdStrike"
              >
                0
              </span>

            </div>

          </label>

          <label class="tool-option sentinelone">

            <input
              type="checkbox"
              value="SentinelOne EDR"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                SentinelOne EDR
              </span>

              <span
                class="filter-count"
                data-count-tool="SentinelOne EDR"
              >
                0
              </span>

            </div>

          </label>

          <label class="tool-option cyflare-itdr">

            <input
              type="checkbox"
              value="Cyflare ITDR"
              checked
              onchange="filterTable()"
            >

            <div class="filter-option-row">

              <span class="filter-option-pill">
                Cyflare ITDR
              </span>

              <span
                class="filter-count"
                data-count-tool="Cyflare ITDR"
              >
                0
              </span>

            </div>

          </label>

        </div>

      </div>

      <!-- SELECT COLUMNS -->

      <div class="dropdown">

        <button
          class="filter-btn"
          onclick="toggleDropdown('columnDropdown')"
        >
          Select Columns
        </button>

        <div
          id="columnDropdown"
          class="dropdown-content"
        >

          <label class="column-option primary">
            <input type="checkbox" checked onchange="toggleColumn(0)">
            <span class="filter-option-pill">Detection Name</span>
          </label>

          <label class="column-option primary">
            <input type="checkbox" checked onchange="toggleColumn(1)">
            <span class="filter-option-pill">Description</span>
          </label>

          <label class="column-option status">
            <input type="checkbox" checked onchange="toggleColumn(2)">
            <span class="filter-option-pill">Default Status</span>
          </label>

          <label class="column-option tool">
            <input type="checkbox" checked onchange="toggleColumn(3)">
            <span class="filter-option-pill">Tool</span>
          </label>

          <label class="column-option connector">
            <input type="checkbox" checked onchange="toggleColumn(4)">
            <span class="filter-option-pill">Connector</span>
          </label>

          <label class="column-option mitre">
            <input type="checkbox" checked onchange="toggleColumn(5)">
            <span class="filter-option-pill">MITRE Tactic</span>
          </label>

          <label class="column-option mitre">
            <input type="checkbox" checked onchange="toggleColumn(6)">
            <span class="filter-option-pill">MITRE Tactic ID</span>
          </label>

          <label class="column-option mitre">
            <input type="checkbox" checked onchange="toggleColumn(7)">
            <span class="filter-option-pill">MITRE Technique</span>
          </label>

          <label class="column-option mitre">
            <input type="checkbox" checked onchange="toggleColumn(8)">
            <span class="filter-option-pill">MITRE Technique ID</span>
          </label>

        </div>

      </div>

      <button
        class="reset-btn action-btn"
        onclick="resetFilters()"
      >
        Reset Filters
      </button>

      <button
        class="action-btn"
        id="toggleMitreBtn"
        onclick="toggleMitreColumns()"
      >
        Hide MITRE Columns
      </button>

      <button
        class="action-btn"
        id="newFilterBtn"
        onclick="toggleNewOnlyFilter()"
      >
        Show New Only
      </button>

    </div>

    <div>

      <button
        class="export-btn action-btn"
        onclick="exportTableToCSV()"
      >
        Export CSV
      </button>

    </div>

  </div>

  <!-- =========================================================
       TABLE

       0 Detection Name
       1 Description
       2 Default Status
       3 Tool
       4 Connector
       5 MITRE Tactic
       6 MITRE Tactic ID
       7 MITRE Technique
       8 MITRE Technique ID
       ========================================================= -->

  <div class="table-container">

    <table id="detectionsTable">

      <thead>

        <tr>

          <th onclick="sortTable(0)">Detection Name</th>
          <th onclick="sortTable(1)">Description</th>
          <th onclick="sortTable(2)">Default Status</th>
          <th onclick="sortTable(3)">Tool</th>
          <th onclick="sortTable(4)">Connector</th>
          <th onclick="sortTable(5)">MITRE Tactic</th>
          <th onclick="sortTable(6)">MITRE Tactic ID</th>
          <th onclick="sortTable(7)">MITRE Technique</th>
          <th onclick="sortTable(8)">MITRE Technique ID</th>

        </tr>

      </thead>

      <tbody></tbody>

    </table>

  </div>

  <script>

    let newOnlyFilter = false;
    let mitreVisible = true;

    const sortDirections = {};

    /* =========================================================
       MODE
       ========================================================= */

    function toggleMode() {

      document.body
        .classList
        .toggle('dark-mode');

      document
        .querySelector('.mode-toggle')
        .textContent =
          document.body.classList.contains('dark-mode')
            ? '☀️'
            : '🌙';

    }

    /* =========================================================
       DROPDOWNS
       ========================================================= */

    function toggleDropdown(id) {

      document
        .getElementById(id)
        .classList
        .toggle('show');

    }

    window.addEventListener(
      'click',
      function(e) {

        if (
          !e.target.closest('.dropdown')
        ) {

          document
            .querySelectorAll(
              '.dropdown-content.show'
            )
            .forEach(
              dropdown =>
                dropdown
                  .classList
                  .remove('show')
            );

        }

      }
    );

    /* =========================================================
       COLUMN VISIBILITY
       ========================================================= */

    function toggleColumn(
      colIndex,
      forceShow = null
    ) {

      const table =
        document.getElementById(
          'detectionsTable'
        );

      const checkbox =
        document.querySelectorAll(
          '#columnDropdown input[type="checkbox"]'
        )[colIndex];

      const show =
        forceShow !== null
          ? forceShow
          : checkbox.checked;

      const ths =
        table.getElementsByTagName('th');

      if (
        ths[colIndex]
      ) {

        ths[colIndex].style.display =
          show
            ? ''
            : 'none';

      }

      const rows =
        table.getElementsByTagName('tr');

      for (
        let i = 1;
        i < rows.length;
        i++
      ) {

        const cells =
          rows[i]
            .getElementsByTagName('td');

        if (
          cells[colIndex]
        ) {

          cells[colIndex].style.display =
            show
              ? ''
              : 'none';

        }

      }

    }

    /* =========================================================
       NEW FILTER
       ========================================================= */

    function toggleNewOnlyFilter() {

      newOnlyFilter =
        !newOnlyFilter;

      document
        .getElementById('newFilterBtn')
        .textContent =
          newOnlyFilter
            ? 'Showing New Only'
            : 'Show New Only';

      filterTable();

    }

    /* =========================================================
       MITRE
       ========================================================= */

    function toggleMitreColumns() {

      const indices =
        [5, 6, 7, 8];

      mitreVisible =
        !mitreVisible;

      const checkboxes =
        document.querySelectorAll(
          '#columnDropdown input[type="checkbox"]'
        );

      indices.forEach(
        index => {

          toggleColumn(
            index,
            mitreVisible
          );

          checkboxes[
            index
          ].checked =
            mitreVisible;

        }
      );

      document
        .getElementById('toggleMitreBtn')
        .textContent =
          mitreVisible
            ? 'Hide MITRE Columns'
            : 'Show MITRE Columns';

    }

    /* =========================================================
       RESET
       ========================================================= */

    function resetFilters() {

      document
        .getElementById('search')
        .value = '';

      document
        .querySelectorAll(
          '#statusDropdown input[type="checkbox"]'
        )
        .forEach(
          cb =>
            cb.checked = true
        );

      document
        .querySelectorAll(
          '#toolDropdown input[type="checkbox"]'
        )
        .forEach(
          cb =>
            cb.checked = true
        );

      document
        .querySelectorAll(
          '#columnDropdown input[type="checkbox"]'
        )
        .forEach(
          (cb, index) => {

            cb.checked = true;

            toggleColumn(
              index,
              true
            );

          }
        );

      newOnlyFilter =
        false;

      mitreVisible =
        true;

      document
        .getElementById('newFilterBtn')
        .textContent =
          'Show New Only';

      document
        .getElementById('toggleMitreBtn')
        .textContent =
          'Hide MITRE Columns';

      filterTable();

    }

    /* =========================================================
       SEARCH MATCH HELPER
       ========================================================= */

    function rowMatchesSearch(
      cells,
      searchValue
    ) {

      if (
        !searchValue
      ) {

        return true;

      }

      return Array
        .from(cells)
        .some(
          cell =>
            cell
              .textContent
              .toLowerCase()
              .includes(searchValue)
        );

    }

    /* =========================================================
       NEW MATCH HELPER
       ========================================================= */

    function rowMatchesNewFilter(
      cells
    ) {

      if (
        !newOnlyFilter
      ) {

        return true;

      }

      return (
        cells[1]
          .innerHTML
          .indexOf('new-badge') !== -1
      );

    }

    /* =========================================================
       UPDATE FACET COUNTS

       Status counts:
       search + tool + new
       but IGNORE status selection.

       Tool counts:
       search + status + new
       but IGNORE tool selection.
       ========================================================= */

    function updateDropdownCounts() {

      const rows =
        document.querySelectorAll(
          '#detectionsTable tbody tr'
        );

      const searchValue =
        document
          .getElementById('search')
          .value
          .trim()
          .toLowerCase();

      const checkedStatuses =
        Array
          .from(
            document.querySelectorAll(
              '#statusDropdown input[type="checkbox"]'
            )
          )
          .filter(
            cb =>
              cb.checked
          )
          .map(
            cb =>
              cb.value
          );

      const checkedTools =
        Array
          .from(
            document.querySelectorAll(
              '#toolDropdown input[type="checkbox"]'
            )
          )
          .filter(
            cb =>
              cb.checked
          )
          .map(
            cb =>
              cb.value
          );

      const statusCounts =
        {};

      const toolCounts =
        {};

      rows.forEach(
        row => {

          const cells =
            row.querySelectorAll('td');

          if (
            cells.length < 9
          ) {

            return;

          }

          const status =
            cells[2]
              .textContent
              .trim();

          const tool =
            cells[3]
              .textContent
              .trim();

          const matchesSearch =
            rowMatchesSearch(
              cells,
              searchValue
            );

          const matchesNew =
            rowMatchesNewFilter(
              cells
            );

          /*
            STATUS COUNT

            Ignore status selections,
            but respect Tool filter.
          */

          const matchesToolForStatus =
            checkedTools.includes(tool);

          if (
            matchesSearch &&
            matchesNew &&
            matchesToolForStatus
          ) {

            statusCounts[
              status
            ] =
              (
                statusCounts[
                  status
                ] || 0
              ) + 1;

          }

          /*
            TOOL COUNT

            Ignore Tool selections,
            but respect Status filter.
          */

          const matchesStatusForTool =
            checkedStatuses.includes(
              status
            );

          if (
            matchesSearch &&
            matchesNew &&
            matchesStatusForTool
          ) {

            toolCounts[
              tool
            ] =
              (
                toolCounts[
                  tool
                ] || 0
              ) + 1;

          }

        }
      );

      document
        .querySelectorAll(
          '[data-count-status]'
        )
        .forEach(
          element => {

            const status =
              element.getAttribute(
                'data-count-status'
              );

            element.textContent =
              statusCounts[
                status
              ] || 0;

          }
        );

      document
        .querySelectorAll(
          '[data-count-tool]'
        )
        .forEach(
          element => {

            const tool =
              element.getAttribute(
                'data-count-tool'
              );

            element.textContent =
              toolCounts[
                tool
              ] || 0;

          }
        );

    }

    /* =========================================================
       FILTER BUTTON STATES
       ========================================================= */

    function updateFilterButtonStates() {

      const statusCheckboxes =
        document.querySelectorAll(
          '#statusDropdown input[type="checkbox"]'
        );

      const checkedStatuses =
        Array
          .from(statusCheckboxes)
          .filter(
            cb =>
              cb.checked
          );

      const statusButton =
        document.getElementById(
          'statusFilterBtn'
        );

      if (
        checkedStatuses.length ===
        statusCheckboxes.length
      ) {

        statusButton.textContent =
          'Default Status';

        statusButton
          .classList
          .remove('filter-active');

      } else {

        statusButton.textContent =
          `Default Status (${checkedStatuses.length}/${statusCheckboxes.length})`;

        statusButton
          .classList
          .add('filter-active');

      }

      const toolCheckboxes =
        document.querySelectorAll(
          '#toolDropdown input[type="checkbox"]'
        );

      const checkedTools =
        Array
          .from(toolCheckboxes)
          .filter(
            cb =>
              cb.checked
          );

      const toolButton =
        document.getElementById(
          'toolFilterBtn'
        );

      if (
        checkedTools.length ===
        toolCheckboxes.length
      ) {

        toolButton.textContent =
          'Tool';

        toolButton
          .classList
          .remove('filter-active');

      } else {

        toolButton.textContent =
          `Tool (${checkedTools.length}/${toolCheckboxes.length})`;

        toolButton
          .classList
          .add('filter-active');

      }

      const newButton =
        document.getElementById(
          'newFilterBtn'
        );

      newButton
        .classList
        .toggle(
          'filter-active',
          newOnlyFilter
        );

    }

    /* =========================================================
       FILTER TABLE
       ========================================================= */

    function filterTable() {

      const searchValue =
        document
          .getElementById('search')
          .value
          .trim()
          .toLowerCase();

      const statusCheckboxes =
        document.querySelectorAll(
          '#statusDropdown input[type="checkbox"]'
        );

      const checkedStatuses =
        Array
          .from(statusCheckboxes)
          .filter(
            cb =>
              cb.checked
          )
          .map(
            cb =>
              cb.value
          );

      const toolCheckboxes =
        document.querySelectorAll(
          '#toolDropdown input[type="checkbox"]'
        );

      const checkedTools =
        Array
          .from(toolCheckboxes)
          .filter(
            cb =>
              cb.checked
          )
          .map(
            cb =>
              cb.value
          );

      const rows =
        document.querySelectorAll(
          '#detectionsTable tbody tr'
        );

      rows.forEach(
        row => {

          const cells =
            row.querySelectorAll('td');

          const status =
            cells[2]
              .textContent
              .trim();

          const tool =
            cells[3]
              .textContent
              .trim();

          const matchesSearch =
            rowMatchesSearch(
              cells,
              searchValue
            );

          const matchesStatus =
            checkedStatuses.includes(
              status
            );

          const matchesTool =
            checkedTools.includes(
              tool
            );

          const matchesNew =
            rowMatchesNewFilter(
              cells
            );

          row.style.display =
            (
              matchesSearch &&
              matchesStatus &&
              matchesTool &&
              matchesNew
            )
              ? ''
              : 'none';

        }
      );

      updateFilterButtonStates();

      updateDropdownCounts();

      updateSummaryMetrics();

    }

    /* =========================================================
       SUMMARY
       ========================================================= */

    function updateSummaryMetrics() {

      const rows =
        document.querySelectorAll(
          '#detectionsTable tbody tr'
        );

      let total = 0;
      let active = 0;
      let testingNew = 0;

      const tools =
        new Set();

      rows.forEach(
        row => {

          if (
            row.style.display ===
            'none'
          ) {

            return;

          }

          const cells =
            row.querySelectorAll('td');

          total++;

          const status =
            cells[2]
              .textContent
              .trim();

          const tool =
            cells[3]
              .textContent
              .trim();

          if (
            status === 'Active'
          ) {

            active++;

          }

          if (
            status === 'Testing' ||
            status === 'New Detection'
          ) {

            testingNew++;

          }

          if (
            tool
          ) {

            tools.add(tool);

          }

        }
      );

      document
        .getElementById('summaryTotal')
        .textContent =
          total;

      document
        .getElementById('summaryActive')
        .textContent =
          active;

      document
        .getElementById('summaryTesting')
        .textContent =
          testingNew;

      document
        .getElementById('summaryTools')
        .textContent =
          tools.size;

    }

    /* =========================================================
       TOOL BADGES
       ========================================================= */

    function getToolClass(tool) {

      switch (tool) {

        case 'Stellar Cyber':
          return 'stellar';

        case 'CrowdStrike':
          return 'crowdstrike';

        case 'SentinelOne EDR':
          return 'sentinelone';

        case 'Cyflare ITDR':
          return 'cyflare-itdr';

        default:
          return 'other';

      }

    }

    function getToolBadge(tool) {

      if (
        !tool
      ) {

        return '';

      }

      return `
        <span class="table-tool-badge ${getToolClass(tool)}">
          ${tool}
        </span>
      `;

    }

    /* =========================================================
       STATUS
       ========================================================= */

    function getStatusColor(status) {

      switch (status) {

        case 'Active':
          return '#435f57';

        case 'Active via Custom Rules':
          return '#8282d2';

        case 'Testing':
        case 'New Detection':
          return '#de9e36';

        case 'Muted':
          return '#8282d2';

        case 'Not Active':
          return '#220c10';

        case 'Alert Preferences':
          return '#066cf4';

        default:
          return '#435f57';

      }

    }

    function getStatusTextColor(status) {

      switch (status) {

        case 'Testing':
        case 'Muted':
          return '#000000';

        default:
          return '#ffffff';

      }

    }

    function getStatusDescription(status) {

      switch (status) {

        case 'Active':
          return 'This detection is actively monitored and alerts are generated.';

        case 'Not Active':
          return 'This detection has low standalone value.';

        case 'Alert Preferences':
          return 'Toggling available under Alert Preferences.';

        case 'Testing':
          return 'Under SOC evaluation.';

        case 'Muted':
          return 'Automatically closed after threshold checks.';

        default:
          return '';

      }

    }

    /* =========================================================
       DATE
       ========================================================= */

    function parseDate(str) {

      if (
        !str
      ) {

        return null;

      }

      const parts =
        str.split('-');

      return new Date(
        parts[2],
        parts[0] - 1,
        parts[1]
      );

    }

    function isRecent(dateStr) {

      const dt =
        parseDate(dateStr);

      if (
        !dt
      ) {

        return false;

      }

      const diffDays =
        (
          new Date() - dt
        ) /
        (
          1000 *
          60 *
          60 *
          24
        );

      return (
        diffDays <= 30
      );

    }

    /* =========================================================
       SORT
       ========================================================= */

    function sortTable(columnIndex) {

      const table =
        document.getElementById(
          'detectionsTable'
        );

      const tbody =
        table.querySelector('tbody');

      const rows =
        Array.from(
          tbody.querySelectorAll('tr')
        );

      sortDirections[
        columnIndex
      ] =
        sortDirections[
          columnIndex
        ] === 'asc'
          ? 'desc'
          : 'asc';

      const direction =
        sortDirections[
          columnIndex
        ];

      rows.sort(
        (a, b) => {

          const aText =
            a.children[
              columnIndex
            ]
              .textContent
              .trim()
              .toLowerCase();

          const bText =
            b.children[
              columnIndex
            ]
              .textContent
              .trim()
              .toLowerCase();

          return direction ===
            'asc'
              ? aText.localeCompare(
                  bText
                )
              : bText.localeCompare(
                  aText
                );

        }
      );

      rows.forEach(
        row =>
          tbody.appendChild(row)
      );

    }

    /* =========================================================
       CSV
       ========================================================= */

    function exportTableToCSV() {

      const table =
        document.getElementById(
          'detectionsTable'
        );

      const csv =
        [];

      table
        .querySelectorAll('tr')
        .forEach(
          row => {

            if (
              row.style.display ===
              'none'
            ) {

              return;

            }

            const rowData =
              [];

            row
              .querySelectorAll(
                'th, td'
              )
              .forEach(
                cell => {

                  if (
                    cell.style.display ===
                    'none'
                  ) {

                    return;

                  }

                  const text =
                    cell
                      .textContent
                      .replace(
                        /"/g,
                        '""'
                      )
                      .trim();

                  rowData.push(
                    `"${text}"`
                  );

                }
              );

            csv.push(
              rowData.join(',')
            );

          }
        );

      const blob =
        new Blob(
          [csv.join('\n')],
          {
            type:
              'text/csv;charset=utf-8;'
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const link =
        document.createElement('a');

      link.href =
        url;

      link.download =
        'detections_board.csv';

      document.body.appendChild(
        link
      );

      link.click();

      link.remove();

      URL.revokeObjectURL(
        url
      );

    }

    /* =========================================================
       LOAD
       ========================================================= */

    function loadData() {

      fetch(
        'detections.json?v=' +
        new Date().getTime()
      )

        .then(
          response =>
            response.json()
        )

        .then(
          data => {

            data.sort(
              (a, b) =>
                a.name.localeCompare(
                  b.name
                )
            );

            const tbody =
              document.querySelector(
                '#detectionsTable tbody'
              );

            tbody.innerHTML =
              '';

            data.forEach(
              det => {

                let description =
                  det.description || '';

                if (
                  det.dateAdded &&
                  isRecent(
                    det.dateAdded
                  )
                ) {

                  description =
                    '<span class="new-badge">New</span> ' +
                    description;

                }

                const row =
                  document.createElement(
                    'tr'
                  );

                row.innerHTML = `

                  <td>
                    ${det.name || ''}
                  </td>

                  <td>
                    ${description}
                  </td>

                  <td>
                    <span
                      class="status-badge"
                      style="
                        background-color: ${getStatusColor(det.defaultStatus)};
                        color: ${getStatusTextColor(det.defaultStatus)};
                      "
                      title="${getStatusDescription(det.defaultStatus)}"
                    >
                      ${det.defaultStatus || ''}
                    </span>
                  </td>

                  <td>
                    ${getToolBadge(det.tool)}
                  </td>

                  <td>
                    ${det.connector || ''}
                  </td>

                  <td>
                    ${det.mitreTactic || ''}
                  </td>

                  <td>
                    ${det.mitreTacticID || ''}
                  </td>

                  <td>
                    ${det.mitreTechnique || ''}
                  </td>

                  <td>
                    ${det.mitreTechniqueID || ''}
                  </td>

                `;

                tbody.appendChild(
                  row
                );

              }
            );

            filterTable();

          }
        )

        .catch(
          error =>
            console.error(
              'Error loading detections.json',
              error
            )
        );

    }

    window.onload =
      loadData;

  </script>
